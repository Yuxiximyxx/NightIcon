# NightIcon 版本目录
# 说明：HonorHook 使用 AGP 9.2.1 + libxposed API 102；本工程为兼容 LSPosed 2.2.1，
# 编译期依赖 libxposed API 101（101.0.1），module.prop 声明 minApiVersion=101。
# 101 与 102 的 Hook 接口形态一致（hook(...).intercept { chain -> }），102 仅新增热重载等能力。
# AGP 取 8.13.x 稳定线（Gradle 8.14.x），减少与 AGP 9 内置 Kotlin 的差异；需要时可整体升到 HonorHook 同款版本。
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
libxposedApi = "101.0.1"
libxposedService = "101.0.0"
# 与 Kotlin 2.2.21 对齐的最后一版 Miuix。0.8+ 需要 Kotlin 2.3，0.9.4 需要 Kotlin 2.4 / AGP 9。
miuix = "0.7.2"
compose = "1.9.3"
activityCompose = "1.10.1"

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposedService" }
miuix = { group = "top.yukonga.miuix.kmp", name = "miuix", version.ref = "miuix" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
